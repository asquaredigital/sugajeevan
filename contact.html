         <script>
                function initMenus() {
                    // Re-init MeanMenu AFTER header is injected
                    if (typeof jQuery !== "undefined" && typeof jQuery.fn.meanmenu !== "undefined") {
                        jQuery('.mean-menu').meanmenu({
                            meanScreenWidth: "1021" // use same value as your theme
                        });
                    }
                }

                // Load header
                fetch("header.html")
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("header1").innerHTML = data;
                        initMenus(); // important: call after inserting header HTML
                    });

                // Load footer
                fetch("footer.html")
                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("footer1").innerHTML = data;
                    });
        </script>

        <script>
  $(document).ready(function () {
    $('#contact_form').submit(function (event) {
      event.preventDefault();

      var formData = {
        u_name:  $('#u_name').val(),
        u_email: $('#u_email').val(),
        phone:   $('#phone').val(),
        message: $('#message').val()
      };

      $.ajax({
        type: 'POST',
        url: 'sendmessage.php',   // change if needed
        data: formData,
        dataType: 'json',
        encode: true
      })
      .done(function (response) {
        // Show mail status
        $('#response-message')
          .css('color', response && response.success ? 'green' : 'red')
          .text(response && response.message ? response.message : 'Submitted.');

        if (response && response.success) {
          // Build WhatsApp message text
          var waText = 
            'New Enquiry%0A' +
            'Name: '   + (formData.u_name  || '-') + '%0A' +
            'Email: '  + (formData.u_email || '-') + '%0A' +
            'Phone: '  + (formData.phone   || '-') + '%0A' +
            'Message:%0A' + (formData.message || '-');

          var waUrl = 'https://wa.me/919994716276?text=' + waText;

          // Try opening WhatsApp
          var win = window.open(waUrl, '_blank');
          if (!win) {
            $('#response-message').append(
              ' • <a href="' + waUrl + '" target="_blank" rel="noopener">Tap to send on WhatsApp</a>'
            );
          }

          // Reset form
          $('#contact_form').trigger('reset');
        }
      })
      .fail(function () {
        $('#response-message')
          .css('color', 'red')
          .text('Error occurred while processing the request.');
      });
    });
  });
</script>
