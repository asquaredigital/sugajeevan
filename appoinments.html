                function initMenus() {

                    }

                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("header1").innerHTML = data;
                        initMenus(); // important: call after inserting header HTML
                    });

                // Load footer

                    .then(response => response.text())
                    .then(data => {
                        document.getElementById("footer1").innerHTML = data;
                    });
        </script>
        <script>
  $(document).ready(function () {
    $('#appointmentform').submit(function (event) {
      event.preventDefault();

      var formData = {
        u_name:  $('#u_name').val(),
        u_email: $('#u_email').val(),
        phone:   $('#phone').val(),
        doctor:  $('#doctorSelect').val(),
        message: $('#message').val()
      };

      $.ajax({
        type: 'POST',
        url: 'appointment.php',
        data: formData,
        dataType: 'json',
        encode: true
      })
      .done(function (response) {
        // show mail status
        $('#response-message')
          .css('color', response && response.success ? 'green' : 'red')
          .text(response && response.message ? response.message : 'Submitted.');

        if (response && response.success) {
          // Build WhatsApp click-to-chat URL (to 9962112230)
          var waText = 
            'New Appointment Request%0A' +
            'Name: '   + (formData.u_name  || '-') + '%0A' +
            'Email: '  + (formData.u_email || '-') + '%0A' +
            'Phone: '  + (formData.phone   || '-') + '%0A' +
            'Doctor: ' + (formData.doctor  || '-') + '%0A' +
            'Message:%0A' + (formData.message || '-');

        //  var waUrl = 'https://wa.me/919994716276?text=' + waText;
        var waUrl = 'https://wa.me/919962112230?text=' + waText;

          // Try opening in a new tab (fallback: show a link if blocked)
          var win = window.open(waUrl, '_blank');
          if (!win) {
            // popup blocked – provide a clickable link
            $('#response-message').append(
              '  •  <a href="' + waUrl + '" target="_blank" rel="noopener">Tap to send on WhatsApp</a>'
            );
          }

          // Reset the form
          $('#appointmentform').trigger('reset');
          $('#doctorSelect').val('');
        }
      })
      .fail(function () {
        $('#response-message')
          .css('color', 'red')
          .text('Error occurred while processing the request.');
      });
    });
  });
</script>
